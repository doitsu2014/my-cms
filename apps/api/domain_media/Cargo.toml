[package]
name = "domain_media"
version = "0.1.0"
edition = "2021"
description = "Self-contained media domain — owns bucket CRUD/access, media create/list/read/delete/metadata, Supabase storage adapter, media DTOs, cache types, and media configuration."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "domain_media"
path = "src/lib.rs"

[dependencies]
async-std = "1.13.2"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["http2", "tracing", "multipart"] }
chrono = { version = "0.4.44", features = ["serde"] }
domain_interface = { path = "../domain_interface" }
hyper = { version = "1.10.1" }
jsonwebtoken = "9.3.1"
lazy_static = "1.5.0"
moka = { version = "0.12.15", features = ["future"] }
nanoid = "0.4.0"
regex = "1"
reqwest = { version = "0.12.28", features = ["json", "multipart"] }
sea-orm = { version = "1.1.20", features = ["debug-print"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slugify = "0.1.0"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["full"] }
tower-cookies = "0.11.0"
tracing = { version = "0.1.44", default-features = false, features = [
  "std",
  "attributes",
] }

[dev-dependencies]
application_core = { path = "../application_core" }
test_helpers = { path = "../test_helpers" }
tokio-test = "0.4"
wiremock = "0.6.5"
