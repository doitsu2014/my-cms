[package]
name = "domain_seo"
version = "0.1.0"
edition = "2021"
description = "Administrator-managed validated SEO head assets for the Ducth website."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "domain_seo"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["http2", "tracing"] }
chrono = { version = "0.4.44", features = ["serde"] }
domain_interface = { path = "../domain_interface" }
html5ever = "0.27"
hyper = "1.10.1"
sea-orm = { version = "1.1.20", features = ["debug-print"] }
sea-orm-migration = { version = "1.1.20", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["full"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
url = "2.5.8"

[dev-dependencies]
async-graphql = { version = "7.2.1", default-features = false, features = ["dynamic-schema"] }
tokio-test = "0.4"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
