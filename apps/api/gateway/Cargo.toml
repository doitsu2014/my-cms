[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
description = "Thin composition root for pluggable domain services (posts, auth, media, user). Produces the my-cms-api binary and iterates a Vec<Box<dyn DomainService>> to compose Axum routers."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "my-cms-api"
path = "src/main.rs"

[dependencies]
domain_interface = { path = "../domain_interface" }
domain_posts = { path = "../domain_posts" }
domain_auth = { path = "../domain_auth" }
domain_media = { path = "../domain_media" }
domain_user = { path = "../domain_user" }
domain_seo = { path = "../domain_seo" }

axum = { version = "0.8.9", features = ["http2", "tracing", "multipart"] }
tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1"
hyper = "1"
tower = "0.5"
tower-http = { version = "0.6.11", features = ["cors"] }
tower-cookies = "0.11"
axum-tracing-opentelemetry = "0.30"
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std", "fmt"] }
init-tracing-opentelemetry = { version = "0.30.1", features = ["otlp", "tracing_subscriber_ext"] }
sea-orm = { version = "1.1.20" }
dotenv = "0.15"
async-graphql = { version = "7.2.1", features = ["dynamic-schema", "chrono", "decimal", "dataloader"] }
async-graphql-axum = { version = "7.2.1" }

[dev-dependencies]
test_helpers = { path = "../test_helpers" }
