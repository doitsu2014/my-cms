[package]
name = "domain_interface"
version = "0.1.0"
edition = "2021"
description = "Stable, publishable contract crate for pluggable domain services. Defines the dyn-compatible DomainService trait and shared types (DomainContext, Mount, RouteRegistration, HealthDescriptor, MigrationDescriptor, DomainConfigError)."
license = "MIT OR Apache-2.0"
publish = true

[lib]
path = "src/lib.rs"

[dependencies]
async-graphql = { version = "7.2.1", default-features = false, features = ["dynamic-schema"] }
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http2"] }
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
futures = "0.3"
sea-orm = { version = "1.1.20", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["sync"] }
uuid = { version = "1.23.2", default-features = false, features = ["v4", "serde"] }