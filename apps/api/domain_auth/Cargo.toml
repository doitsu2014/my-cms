[package]
name = "domain_auth"
version = "0.1.0"
edition = "2021"
description = "Self-contained Supabase authentication domain service."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "domain_auth"
path = "src/lib.rs"

[[bin]]
name = "domain_auth"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["http2"] }
domain_interface = { path = "../domain_interface" }
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
