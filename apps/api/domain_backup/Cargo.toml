[package]
name = "domain_backup"
version = "0.1.0"
edition = "2021"
description = "Backup/restore U1 domain: status enum and guards, bounded configuration, clock and safe error projection."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "domain_backup"
path = "src/lib.rs"

# Dependency choices (WU-01 Done when; versions match sibling crates and apps/api/Cargo.lock):
# - serde 1.0.228 (derive): BackupJobStatus wire spelling, safe response bodies.
# - serde_json 1.0.150: the `components` jsonb column (WU-03 job store) and wire-format assertions.
# - thiserror 2.0: error enums, same major as domain_media and domain_seo.
# - chrono 0.4.44 (serde): Clock port timestamps.
# - Fixture-storage lock: std File::try_lock only, no fd-lock or fs4 crate
#   (implementation-plan.md RK-06). Added in the WU that needs it, not here.
# - sea-orm-migration 1.1.20 (same version as domain_seo) and tokio-util are the
#   spine's later choices (WU-02 and WU-05 onward). They are NOT added in WU-01 because
#   no WU-01 code uses them; add them in the unit that first needs them.
[dependencies]
async-graphql = { version = "7.2.1", features = ["dynamic-schema"] }
async-trait = "0.1"
axum = { version = "0.8.9", features = ["http2", "tracing"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
domain_interface = { path = "../domain_interface" }
sea-orm = { version = "1.1.20", features = ["debug-print"] }
sea-orm-migration = { version = "1.1.20", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[dev-dependencies]
# futures-core: Stream impl for the request-body polling spy (WU-09 tests); already in Cargo.lock.
futures-core = "0.3.32"
async-graphql = { version = "7.2.1", features = ["dynamic-schema"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.52.3", features = ["full", "test-util"] }
