[package]
name = "domain_posts"
version = "0.1.0"
edition = "2021"
description = "Self-contained Blog Post Service — owns post REST adapters, application-layer command handlers, presentation models, generated entities, translation integration, GraphQL contribution, migrations, and a standalone bin."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "domain_posts"
path = "src/lib.rs"

[[bin]]
name = "domain_posts"
path = "src/main.rs"

[dependencies]
async-std = "1.13.2"
async-openai = "0.27"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["http2", "tracing", "multipart"] }
axum-tracing-opentelemetry = { version = "0.30.1" }
chrono = { version = "0.4.44", features = ["serde"] }
dotenv = "0.15.0"
domain_auth = { path = "../domain_auth" }
domain_interface = { path = "../domain_interface" }
fake = { version = "4.4.0", features = ["derive"] }
futures = "0.3"
html5ever = "0.27"
http = "1"
hyper = { version = "1.10.1" }
init-tracing-opentelemetry = { version = "0.30.1", features = [
  "otlp",
  "tracing_subscriber_ext",
] }
lazy_static = "1.5.0"
markup5ever_rcdom = "0.3"
moka = { version = "0.12.15", features = ["future"] }
nanoid = "0.4.0"
rand = "0.9.4"
regex = "1"
reqwest = { version = "0.12.28", features = ["multipart"] }
sea-orm = { version = "1.1.20", features = ["debug-print"] }
sea-orm-macros = "1.1.20"
sea-orm-migration = { version = "1.1.20", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
seaography = { version = "1.1.4", features = [
  "with-decimal",
  "with-chrono",
  "with-postgres-array",
  "with-uuid",
] }
async-graphql = { version = "7.2.1", features = [
  "decimal",
  "chrono",
  "dataloader",
  "dynamic-schema",
] }
async-graphql-axum = { version = "7.2.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slugify = "0.1.0"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-cookies = "0.11.0"
tower-http = { version = "0.6.11", features = ["fs", "tracing", "cors"] }
tracing = { version = "0.1.44", default-features = false, features = [
  "std",
  "attributes",
] }
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "registry",
  "std",
  "fmt",
] }
tracing-opentelemetry = "0.31.0"
tracing-opentelemetry-instrumentation-sdk = "0.30.0"
opentelemetry = "0.30.0"
opentelemetry-otlp = "0.30.0"
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[dev-dependencies]
application_core = { path = "../application_core" }
test_helpers = { path = "../test_helpers" }
tokio-test = "0.4"
wiremock = "0.6.5"