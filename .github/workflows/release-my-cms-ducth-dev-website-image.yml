name: Build and Release Ducth Dev Website Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/ducth-dev-website/**"
      - "packages/editor-prose/**"
      - ".github/workflows/release-my-cms-ducth-dev-website-image.yml"

permissions:
  contents: read

concurrency:
  group: docker-hub-my-cms-ducth-dev-website-publish
  cancel-in-progress: true

jobs:
  build_push_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: doitsu2014/my-cms-ducth-dev-website
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "./apps/ducth-dev-website"
          file: "./apps/ducth-dev-website/Dockerfile"
          build-contexts: |
            editor-prose=./packages/editor-prose
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=my-cms-ducth-dev-website
          cache-to: type=gha,mode=max,scope=my-cms-ducth-dev-website
          platforms: linux/amd64,linux/arm64
