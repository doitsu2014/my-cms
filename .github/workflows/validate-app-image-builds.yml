name: Validate Application Image Builds

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/ducth-dev-website/**"
      - "packages/editor-prose/**"
      - "deployments/docker-swarm/apps/docker-compose.yaml"
      - ".github/workflows/release-my-cms-admin-image.yml"
      - ".github/workflows/validate-app-image-builds.yml"
      - "scripts/validate-app-image-build-contract.sh"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/ducth-dev-website/**"
      - "packages/editor-prose/**"
      - "deployments/docker-swarm/apps/docker-compose.yaml"
      - ".github/workflows/release-my-cms-admin-image.yml"
      - ".github/workflows/validate-app-image-builds.yml"
      - "scripts/validate-app-image-build-contract.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            tag: my-cms-api:validation
            context: ./apps/api
            file: ./apps/api/Dockerfile
          - name: Admin
            tag: my-cms-admin:validation
            context: ./apps/web
            file: ./apps/web/Dockerfile
            build_context: editor-prose=./packages/editor-prose
          - name: Ducth
            tag: ducth-dev-website:validation
            context: ./apps/ducth-dev-website
            file: ./apps/ducth-dev-website/Dockerfile
            build_context: editor-prose=./packages/editor-prose

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate image build contract
        run: ./scripts/validate-app-image-build-contract.sh

      - name: Validate Compose build configuration
        run: docker compose -f deployments/docker-swarm/apps/docker-compose.yaml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build_context || '' }}
          push: false
          tags: ${{ matrix.tag }}
          provenance: false
